[package]
name = "rust_scan_engine"
version = "2.0.0"
edition = "2021"
description = "High-Performance Advanced Security & Threat Intelligence Scan Engine for NEX-APP"
authors = ["NEX-APP Security Team"]
license = "MIT"

[[bin]]
name = "rust_scan_engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.9"
walkdir = "2.4"
chrono = { version = "0.4", features = ["clock", "serde"] }
